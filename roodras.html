<h1> Het rood ras van West-Vlaanderen</h1>

<a class="video"
   href="https://sle.be/wat-doen-we/publicaties/het-rood-ras-van-west-vlaanderen"
   target="_blank"
   rel="noopener noreferrer">

<h1> Genetica avant la lettre <br>
Erfelijkheidsleer, 100 jaar geleden reeds toegepast door de agrarische sector van de Westhoek
</h1>

<div class="video-container">
    <iframe
        src="https://www.youtube.com/embed/SE6VYK-I3FI"
        title="Beelden uit de jaren 80"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>
</div>
<div class="hint"> 🔍 Zoomen met muiswiel of +/-  • Dubbelklik of Esc = terug naar normale grootte </div>
<img id="foto" src="images/roodmz.jpg" alt="Hoeve MZ">

<hr>
<script>

const foto = document.getElementById("foto");

// Beginwaarde
foto.dataset.scale = 1;

// ====================================================
// Muiswiel : in- en uitzoomen
// ====================================================

foto.addEventListener("wheel", function(e) {

    e.preventDefault();

    let scale = parseFloat(foto.dataset.scale);

    scale *= (e.deltaY < 0) ? 1.05 : 0.95;
    scale = Math.max(0.5, Math.min(2.0, scale));

    foto.style.transform = `scale(${scale})`;
    foto.dataset.scale = scale;

}, { passive:false });

// ====================================================
// Dubbelklik : normale grootte
// Eén klik : verklein naar 80%
// ====================================================

foto.addEventListener("click", function() {

    foto.style.transform = "scale(0.95)";
    foto.dataset.scale = 0.95;

});

foto.addEventListener("dblclick", function() {

    foto.style.transform = "scale(1)";
    foto.dataset.scale = 1;

});

// ====================================================
// Toetsenbord
// +   : vergroten
// -   : verkleinen
// Esc : normale grootte
// ====================================================

document.addEventListener("keydown", function(e) {

    let scale = parseFloat(foto.dataset.scale);

    if (e.key === "+" || e.key === "=") {
        scale *= 1.05;
    }

    if (e.key === "-") {
        scale *= 0.95;
    }

    if (e.key === "Escape") {
        scale = 1;
    }

    scale = Math.max(0.5, Math.min(2.0, scale));

    foto.style.transform = `scale(${scale})`;
    foto.dataset.scale = scale;

});

</script>


</body>
